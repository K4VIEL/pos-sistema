    async function editarStock(idProducto, stockActual) {
      const nuevoStockStr = prompt("Ingresa la nueva cantidad en stock:", stockActual);
      
      // Si el usuario da clic en Cancelar o presiona Esc
      if (nuevoStockStr === null) return;

      const nuevoStock = parseInt(nuevoStockStr);

      if (isNaN(nuevoStock) || nuevoStock < 0) {
        return alert("Por favor ingresa un número válido mayor o igual a 0.");
      }

      // Actualización en Supabase usando la instancia local 'supabaseClient'
      const { error } = await supabaseClient
        .from('productos')
        .update({ stock: nuevoStock })
        .eq('id', idProducto);

      if (error) {
        alert("Error al actualizar stock: " + error.message);
